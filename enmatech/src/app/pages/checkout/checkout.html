<div class="container py-5">
  <div class="row g-4">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white fw-bold py-3">
          Detalles de Facturación
        </div>
        <div class="card-body p-4">
          <form (submit)="procesarPago($event)">
            <div class="mb-3">
              <label class="form-label fw-bold">Nombre Completo</label>
              <input type="text" class="form-control" required placeholder="Ej. Juan Pérez">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Dirección de Envío</label>
              <input type="text" class="form-control" required placeholder="Tu dirección completa">
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">Número de Tarjeta (Simulado)</label>
              <input type="text" class="form-control" required placeholder="0000 0000 0000 0000">
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold fs-5 py-2 shadow-sm">
              Confirmar y Pagar
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body bg-light p-4">
          <h5 class="fw-bold mb-4 text-primary">Resumen de tu Orden</h5>
          <div class="d-flex justify-content-between mb-3 text-muted">
            <span>Subtotal</span>
            <span>${{ carritoService.obtenerTotal() }}</span>
          </div>
          <div class="d-flex justify-content-between mb-4 text-muted">
            <span>Costo de Envío</span>
            <span class="text-success fw-bold">¡Gratis!</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between fw-bold fs-4 mt-3">
            <span>Total</span>
            <span class="text-primary">${{ carritoService.obtenerTotal() }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
